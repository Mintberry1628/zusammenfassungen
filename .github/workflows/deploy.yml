# Veroeffentlicht den Ordner "web" automatisch auf GitHub Pages.
# Laeuft bei jedem Push auf main - du musst nichts weiter tun.
name: App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:   # erlaubt manuelles Starten im Reiter "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veroeffentlichungen gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      # Traegt Versionskuerzel und Zeitstempel in die Dateien ein. Dadurch aendert sich der
      # Service Worker bei jeder Veroeffentlichung (das Handy laedt die neue Fassung von selbst)
      # und die App kann unten in den Einstellungen anzeigen, welche Version gerade laeuft.
      - name: Version einstempeln
        run: |
          KURZ=$(git rev-parse --short HEAD)
          STAND=$(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')
          sed -i "s/__VERSION__/$KURZ/g; s/__BUILT__/$STAND/g" web/index.html web/service-worker.js
          echo "Veroeffentlicht: $KURZ vom $STAND"

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ordner "web" hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
